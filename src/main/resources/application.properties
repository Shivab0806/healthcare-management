spring.application.name=healthcare-inventory

server.port=8080

# ---------- MySQL database ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/healthcare_inventory?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- Liquibase ----------
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# disable schema/data SQL initialization because Liquibase manages schema
after this point
spring.sql.init.mode=never

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false
